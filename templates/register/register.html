{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - WIDS</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Core Theme CSS -->
    <link rel="stylesheet" href="{% static 'css/netguard_theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/login/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/wids_theme.css' %}">
</head>
<body class="theme-dark">
    <div class="auth-wrapper">
        <div class="auth-card register-card">
            <div class="auth-header">
                <div class="auth-logo-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="auth-title">Create Operator Account</h1>
                <p class="auth-subtitle">Create your Wandering IDS operator account</p>
            </div>

            {% if error %}
            <div class="flash-messages" style="margin-bottom: 1.25rem;">
                <div class="flash-banner danger">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="dashboard-grid-equal" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" value="{{ form_data.full_name|default:'' }}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" name="username" class="form-control" placeholder="Choose username" value="{{ form_data.username|default:'' }}" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Institutional / Work Email</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" class="form-control" placeholder="analyst@university.edu" value="{{ form_data.email|default:'' }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Security Role</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-shield-halved"></i>
                        <select name="role" class="form-control" style="padding-left: 2.75rem;">
                            <option value="Network Security Analyst">Network Security Analyst</option>
                            <option value="Student Researcher">Student Researcher</option>
                            <option value="System Administrator">System Administrator</option>
                            <option value="Lab Monitor">Lab Monitor</option>
                        </select>
                    </div>
                </div>

                <div class="dashboard-grid-equal" style="margin-bottom: 1.5rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Password</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-icon-group">
                            <i class="fa-solid fa-lock-open"></i>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    <i class="fa-solid fa-user-check"></i> Register Operator Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                Already have an account? <a href="{% url 'login:login' %}" style="font-weight: 600;">Sign In Instead</a>
            </div>
        </div>
    </div>
</body>
</html>
